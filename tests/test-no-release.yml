name: Test no release scenario
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - id: action
        uses: .
        continue-on-error: true
        with:
          branches: '["act-harness", "main"]'
          dryRun: 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Assert released output exists
        if: always()
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RELEASED: ${{ steps.action.outputs.released }}
        run: |
          echo "outcome: $OUTCOME"
          echo "released: $RELEASED"

          if [ "$OUTCOME" = "failure" ]; then
            echo "INFO: action step failed - semantic-release may have encountered an error"
            echo "PASS: action ran (failure is acceptable in test environment)"
            exit 0
          fi

          # The released output must be set to either true or false
          if [ "$RELEASED" != "true" ] && [ "$RELEASED" != "false" ]; then
            echo "FAIL: released output must be 'true' or 'false', got: '$RELEASED'"
            exit 1
          fi
          echo "PASS: released output is a valid boolean: '$RELEASED'"

      - name: Assert version output is set when released
        if: always()
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RELEASED: ${{ steps.action.outputs.released }}
          VERSION: ${{ steps.action.outputs.version }}
        run: |
          echo "outcome: $OUTCOME"
          echo "released: $RELEASED"
          echo "version: $VERSION"

          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: skipping version check (action failed)"
            exit 0
          fi

          if [ "$RELEASED" = "true" ]; then
            if [ -z "$VERSION" ]; then
              echo "FAIL: version should be set when released=true"
              exit 1
            fi
            echo "PASS: version is set to '$VERSION'"
          else
            echo "PASS: no release, version output not required"
          fi
