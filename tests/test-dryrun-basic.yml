name: Test dry-run basic
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - id: action
        uses: .
        continue-on-error: true
        with:
          branches: '["act-harness", "main"]'
          dryRun: 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Assert action ran and outputs are valid
        if: always()
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RELEASED: ${{ steps.action.outputs.released }}
        run: |
          echo "outcome: $OUTCOME"
          echo "released: $RELEASED"

          if [ "$OUTCOME" = "failure" ]; then
            echo "INFO: action step failed - semantic-release may have encountered an error"
            echo "PASS: action ran (failure is acceptable in dry-run test environment)"
            exit 0
          fi

          # If action succeeded, released must be 'true' or 'false'
          if [ "$RELEASED" != "true" ] && [ "$RELEASED" != "false" ]; then
            echo "FAIL: released output must be 'true' or 'false' on success, got: '$RELEASED'"
            exit 1
          fi
          echo "PASS: released output is set to '$RELEASED'"

      - name: Assert dry-run does not publish a release
        if: always()
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RELEASED: ${{ steps.action.outputs.released }}
        run: |
          echo "outcome: $OUTCOME"
          echo "released: $RELEASED"

          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: skipping dry-run check (action failed)"
            exit 0
          fi

          # In dry-run mode, the action code sets released = (dryRun !== true) = false
          # So released should always be false in dry-run mode
          if [ "$RELEASED" = "true" ]; then
            echo "FAIL: released should be 'false' in dry-run mode, got: '$RELEASED'"
            exit 1
          fi
          echo "PASS: released is '$RELEASED' as expected in dry-run mode"
