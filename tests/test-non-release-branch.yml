name: Test non-release branch (no release expected)
on:
  workflow_dispatch:
jobs:
  test-non-release-branch:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: fake-token-for-testing
      GITHUB_REF: refs/heads/feature-branch
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          branches: '["main"]'
          dryRun: 'false'
        continue-on-error: true

      - name: Assert released is false on non-release branch
        env:
          RELEASED: ${{ steps.action.outputs.released }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "released: $RELEASED"
          # On a non-release branch, semantic-release should not publish
          # released output should be false or empty
          if [ "$RELEASED" = "true" ]; then
            echo "FAIL: released should not be true on a non-release branch"
            exit 1
          fi
          echo "PASS: released is not true on non-release branch"
