name: Test dry-run tag and changelog outputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - id: action
        uses: .
        continue-on-error: true
        with:
          branches: '["act-harness", "main"]'
          dryRun: 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Assert outputs are consistent
        if: always()
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RELEASED: ${{ steps.action.outputs.released }}
          TAG: ${{ steps.action.outputs.tag }}
          VERSION: ${{ steps.action.outputs.version }}
          CHANGELOG: ${{ steps.action.outputs.changelog }}
        run: |
          echo "outcome: $OUTCOME"
          echo "released: $RELEASED"
          echo "tag: $TAG"
          echo "version: $VERSION"
          echo "changelog length: ${#CHANGELOG}"

          if [ "$OUTCOME" = "failure" ]; then
            echo "INFO: action step failed - semantic-release may have encountered an error"
            echo "PASS: action ran (failure is acceptable in test environment)"
            exit 0
          fi

          # released must be a boolean string
          if [ "$RELEASED" != "true" ] && [ "$RELEASED" != "false" ]; then
            echo "FAIL: released must be 'true' or 'false', got: '$RELEASED'"
            exit 1
          fi

          # If released=true, tag and version must be set
          if [ "$RELEASED" = "true" ]; then
            if [ -z "$TAG" ]; then
              echo "FAIL: tag must be set when released=true"
              exit 1
            fi
            if [ -z "$VERSION" ]; then
              echo "FAIL: version must be set when released=true"
              exit 1
            fi
            # Tag should start with 'v' followed by version
            EXPECTED_TAG="v${VERSION}"
            if [ "$TAG" != "$EXPECTED_TAG" ]; then
              echo "FAIL: tag '$TAG' should equal 'v$VERSION' ('$EXPECTED_TAG')"
              exit 1
            fi
            echo "PASS: tag=$TAG version=$VERSION are consistent"
          else
            echo "PASS: no release, outputs not required"
          fi
