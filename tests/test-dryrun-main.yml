name: Test dry-run on main branch
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - id: action
        uses: .
        with:
          branches: '["main"]'
          dryRun: 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Assert action ran without input parsing errors
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # In act without a real GitHub token, semantic-release will fail at the
          # GitHub plugin authentication step. This is expected and acceptable.
          # The test verifies the action starts and processes inputs (not a crash
          # from bad JSON parsing or missing required inputs).
          # Both 'success' and 'failure' are acceptable outcomes here.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome=$OUTCOME is acceptable in act environment)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
